name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/s3-migration-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: app/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release assets
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          VER=${GITHUB_REF_NAME#v}
          mkdir -p dist
          sed -e "s#build: ./app/backend#image: ghcr.io/${OWNER}/s3-migration-backend:${VER}#" \
              -e "s#build: ./app/frontend#image: ghcr.io/${OWNER}/s3-migration-frontend:${VER}#" \
              docker-compose.yml > dist/docker-compose.yml
          cp .env.example dist/.env.example
          tar czf dist/s3-migration-tool-${GITHUB_REF_NAME}-deploy.tar.gz -C dist docker-compose.yml .env.example
          cat > dist/notes.md <<EOF
          ## 镜像
          - \`ghcr.io/${OWNER}/s3-migration-backend:${VER}\`
          - \`ghcr.io/${OWNER}/s3-migration-frontend:${VER}\`

          支持 linux/amd64 与 linux/arm64。

          ## 快速部署（无需源码）
          下载 \`s3-migration-tool-${GITHUB_REF_NAME}-deploy.tar.gz\` 并解压，然后：
          \`\`\`bash
          cp .env.example .env   # 修改密码与密钥
          docker compose up -d
          \`\`\`
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notes.md
          generate_release_notes: true
          files: |
            dist/s3-migration-tool-${{ github.ref_name }}-deploy.tar.gz
            dist/docker-compose.yml
